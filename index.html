<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Spots</title><meta name="author" content="Filip Milosevic"/><meta name="description" content="This is my Spots Project"/><meta name="keywords" content="CSS, HTML"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="d3610e9c6dce3cb370d8.svg" alt="Logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><img class="profile__avatar" src="04c411e519a1c6561568.jpg" alt="Bessie Coleman"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img class="profile__edit-icon" src="d38272e02bb4f1ab1c37.svg" alt="Pen icon"/>Edit Profile</button></div><button type="button" class="profile__add-button"><img class="profile__plus-icon" src="40608da7369d39bc1077.svg" alt="Plus icon"/>New Post</button></section><section class="cards"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-button"></button> <img class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2023 &copy; Spots</p></footer><div class="modal" id="edit-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="a326e1ad56a2cd944a28.svg" alt="close-icon" class="modal__close-icon"/></button><h2 class="modal__title">Edit profile</h2><form name="edit-profile" class="modal__form"><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="add-card-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="a326e1ad56a2cd944a28.svg" alt="close-icon" class="modal__close-icon"/></button><h2 class="modal__title">New post</h2><form name="add-card" class="modal__form"><label for="add-card-link-input" class="modal__label">Image link <input id="add-card-link-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="add-card-link-input-error" class="modal__error"></span></label> <label for="add-card-caption-input" class="modal__label">Caption <input id="add-card-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="add-card-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__container modal__container_type_preview"><button type="button" class="modal__close-button"><img src="53f0bab7ec2e970778f9.svg" alt="close-icon" class="modal__close-icon modal__close-icon_type_preview"/></button> <img class="modal__image" src="" alt=""/><p class="modal__caption"></p></div></div></div></body></html>
